version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bike2carbon_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bike2carbon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bike2carbon123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
